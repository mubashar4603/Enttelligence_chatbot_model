<!DOCTYPE html>
<html>
<head>
    <meta charset="UTF-8">
    <title>Reset Your Password | HVAC Assist</title>
</head>
<body style="background-color:#f4f4f4; margin:0; padding:0;">
    <table cellpadding="0" cellspacing="0" border="0" width="100%" style="background-color:#f4f4f4;">
        <tr>
            <td align="center">
                <table cellpadding="0" cellspacing="0" border="0" width="600" style="background-color:#ffffff; margin:20px auto; border-radius:8px; box-shadow:0 2px 8px rgba(0,0,0,0.05); font-family:Arial, sans-serif;">
                    
                    <!-- Header -->
                    <tr>
                        <td style="padding:24px 24px 0 24px; font-size:20px; color:#222; font-weight:bold;">
                            Password Reset Request
                        </td>
                    </tr>

                    <!-- Greeting -->
                    <tr>
                        <td style="padding:8px 24px 0 24px; font-size:15px; color:#222;">
                            Hello <strong>{{ username }}</strong>,
                        </td>
                    </tr>

                    <!-- Message -->
                    <tr>
                        <td style="padding:8px 24px 0 24px; font-size:15px; color:#222;">
                            We received a request to reset your password for your HVAC Assist account.
                        </td>
                    </tr>

                    <tr>
                        <td style="padding:8px 24px 0 24px; font-size:15px; color:#222;">
                            Click the button below to choose a new password:
                        </td>
                    </tr>

                    <!-- CTA Button -->
                    <tr>
                        <td align="center" style="padding:24px;">
                            <a href="{{ reset_url }}" style="display:inline-block; padding:12px 32px; background-color:#007bff; color:#ffffff; text-decoration:none; border-radius:6px; font-size:16px;">
                                Reset Password
                            </a>
                        </td>
                    </tr>

                    <!-- Additional Info -->
                    <tr>
                        <td style="padding:8px 24px 0 24px; font-size:13px; color:#888;">
                            If you didn’t request this password reset, you can safely ignore this email.
                        </td>
                    </tr>

                    <!-- Footer -->
                    <tr>
                        <td style="padding:24px 24px 24px 24px; font-size:13px; color:#222;">
                            Best regards,<br>
                            <strong>HVAC Assist Team</strong>
                        </td>
                    </tr>

                </table>
            </td>
        </tr>
    </table>
</body>
</html>
